<style>

  .stage { position: relative; display: flex; flex-direction: column; height: 100%; min-height: 420px; box-sizing: border-box;
           user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
           font-family: 'Oswald','Bebas Neue',Impact,'Arial Narrow',sans-serif; }

      font-size: clamp(28px, 9vw, 38px); line-height: 1.05; font-weight: 700; color: #f7c921; letter-spacing: 1px;

                   60% { transform: translate(-50%,-50%) rotate(var(--rot,0deg)) scale(1.25); }
                   100% { transform: translate(-50%,-50%) rotate(var(--rot,0deg)) scale(1); } }
  .flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  .flash.y { background: #fff3a0; animation: fl .35s ease-out; }
  .flash.r { background: #e03131; animation: fl .35s ease-out; }
  @keyframes fl { from { opacity: .6; } to { opacity: 0; } }
  .shake { animation: shake .32s; }
  @keyframes shake { 0%,100% { transform: translate(0,0); } 20% { transform: translate(-7px,3px); } 40% { transform: translate(6px,-4px); }
                     60% { transform: translate(-5px,-2px); } 80% { transform: translate(3px,3px); } }
  #fx { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
    .mute { position: absolute; z-index: 5; right: 8px; bottom: max(8px, env(safe-area-inset-bottom)); width: 40px; height: 40px; border: 0; border-radius: 50%;
      background: rgba(17,17,17,.88); font-size: 16px; cursor: pointer; padding: 0; touch-action: manipulation; }
    .panel { position: absolute; z-index: 3; left: 50%; top: 50%; transform: translate(-50%,-50%); width: min(320px, calc(100% - 24px));
       text-align: center; color: #fff; background: rgba(17,17,17,.93); border: 3px solid #f7c921; border-radius: 14px;
       padding: 16px 18px; box-sizing: border-box; }
  body:not(.show-toggle) .shopify-buy-frame--toggle { display: none !important; }
  .panel { max-height: 92%; overflow-y: auto; }

  .result-note { display: block; margin-top: 8px; font-size: 12px; line-height: 1.35; }
  .panel button { min-height: 44px; font: inherit; font-size: 18px; letter-spacing: 1.5px; background: #f7c921; color: #111;
                  border: 0; border-radius: 8px; padding: 9px 26px; cursor: pointer; touch-action: manipulation; }
  @media (max-width: 600px) {

    .cue { width: 88%; font-size: clamp(34px, 10vw, 44px); -webkit-text-stroke-width: 4px; }
    .panel { width: min(350px, calc(100% - 20px)); padding: 22px 20px; border-width: 4px; }
    .panel h1 { margin-bottom: 10px; font-size: 32px; }

<script>
